services:
  - type: web
    name: lubricentro-san-jose
    runtime: node
    # OJO: Render solo permite attaching un disco persistente en planes pagos.
    # Con `plan: free` la app funciona igual, pero la SQLite se borra en cada
    # redeploy (el filesystem es efímero).
    plan: starter
    # OJO: backend/ tiene su propio package.json (express, cors, dotenv,
    # nodemailer). Sin `npm install --prefix backend` el build pasa igual pero
    # `npm start` revienta con ERR_MODULE_NOT_FOUND: dotenv y Render marca el
    # deploy como fallido.
    buildCommand: npm install && npm install --prefix backend && npm install --prefix frontend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      # La base vive dentro del disco montado (ver `disk` abajo), no en el
      # filesystem efímero del contenedor.
      - key: DB_PATH
        value: /var/data/lubricentro.db
    disk:
      name: lubricentro-data
      mountPath: /var/data
      sizeGB: 1
