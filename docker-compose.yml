services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lubricentro_api
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro

  db:
    image: postgres:16-alpine
    container_name: lubricentro_db
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lubricentro_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
